name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck & self-test (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline and deterministic: the model is a fixture string or a scripted
      # stub, so these run on every push without a key and without spending
      # anything. Windows-only sandbox escapes self-skip on Linux.
      - name: Offline test suites (loop, sandbox, approvals, jobs)
        run: npm run test:loop && npm run test:sandbox && npm run test:approvals && npm run test:jobs

      - name: Self-test (in-memory MCP round trip, no network)
        run: npm run selftest:memory
